<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — ThetaFlicks</title>
<link rel="icon" type="image/x-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0f1218;
    --text: #D7D7D7;
    --text-dim: #8a9bae;
    --accent: #39cccc;
    --border: #1e2330;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Radial Gradient Background */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(79,195,247,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(79,195,247,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Nav */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 24px;
}

.logo { 
    display: inline-flex;
    align-items: center;
    text-decoration: none; 
}

.logo img {
    height: 32px;
    width: auto;
    display: block;
}

/* Main */
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 24px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
}

.error-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(6rem, 20vw, 10rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    color: #ffffff;
    opacity: 0.95;
    margin-bottom: 16px;
}

.error-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 12px;
}

.error-desc {
    font-size: 0.95rem;
    color: var(--text-dim);
    margin-bottom: 40px;
    max-width: 380px;
}

/* Reused your back-link style for the retry button */
.retry-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #151922;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    font-family: 'Inter', sans-serif;
}

.retry-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #1a202c;
}

.retry-btn .arrow {
    transition: transform 0.2s ease;
}

.retry-btn:hover .arrow {
    transform: rotate(-360deg); /* Fun spin effect on hover for retry */
}

/* Footer */
footer {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
    nav { padding: 24px 20px; }
    .logo img { height: 28px; }
    .error-title { font-size: 1.25rem; }
}
</style>
</head>
<body>

<nav>
    <a href="#" class="logo">
        <img src="thetaflicks.png" alt="ThetaFlicks">
    </a>
</nav>

<main>
    <div class="error-code">OFF</div>
    <h1 class="error-title">You're offline.</h1>
    <p class="error-desc">It looks like you've lost your internet connection or the site is taking too long to load. Please check your network and try again.</p>
    
    <button class="retry-btn" id="retry-btn">
        <span class="arrow">↻</span>
        Retry Connection
    </button>
</main>

<footer>
    &copy; 2026 Nicodemus Gurning · ThetaFlicks has been airing since 2024!
</footer>

<script>
    // Securely communicate with main.js to retry loading the app
    document.getElementById('retry-btn').addEventListener('click', () => {
        if (window.electronAPI && window.electronAPI.retryLoad) {
            window.electronAPI.retryLoad();
        } else {
            // Fallback for standard browser testing
            window.location.reload();
        }
    });
</script>

</body>
</html>
